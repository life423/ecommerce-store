services:
  frontend:
    build:
      context: .
      target: frontend
    init: true
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/index.html:/app/frontend/index.html
      - ./frontend/vite.config.ts:/app/frontend/vite.config.ts
      - ./frontend/postcss.config.js:/app/frontend/postcss.config.js
    environment:
      API_PROXY_TARGET: http://backend:3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/src/main.tsx').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
  backend:
    build:
      context: .
      target: backend
    init: true
    env_file:
      - path: ./backend/.env
        required: false
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backend/src:/app/backend/src
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/ecommerce
      ENABLE_CATALOG_EDITOR: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:8
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
volumes:
  mongo-data:
